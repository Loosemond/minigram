<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4a3a30">
<title>Pokémon minigames</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<script>
  // The server can turn requests away for a few seconds when many come at
  // once. So an image that fails is loaded
  // again, with ?retry=n (a browser won't reload a URL that just failed), and
  // if the page's style or code fails, the whole page is, once the server
  // answers again (so the reload isn't turned away too), up to 3 times.
  // src/retry.js does the same for the models, pictures and sound.
  addEventListener("error", (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.getAttribute("src")) return;
    const n = +(img.dataset.retries || 0);
    if (n >= 6) return;
    img.dataset.retries = n + 1;
    const url = new URL(img.getAttribute("src"), location.href);
    url.searchParams.set("retry", n + 1);
    setTimeout(() => { if (img.isConnected) img.src = url.href; }, 500 * 2 ** Math.min(n, 4));
  }, true);
  function reloadPage() {
    if (reloadPage.called) return;
    reloadPage.called = true;
    let n = 3;
    try { n = +sessionStorage.getItem("egg-reloads") || 0; sessionStorage.setItem("egg-reloads", n + 1); } catch {}
    const giveUp = () => {
      const say = () => { const p = document.querySelector("#loading p"); if (p) p.textContent = "Couldn't load the game. Try again in a minute."; };
      document.readyState === "loading" ? addEventListener("DOMContentLoaded", say) : say();
    };
    if (n >= 3) return giveUp();
    (async () => {
      for (const ms of [500, 1000, 2000, 4000, 4000, 4000, 4000, 4000]) {
        await new Promise((r) => setTimeout(r, ms));
        try { if ((await fetch(location.href, { cache: "no-store" })).ok) return location.reload(); } catch {}
      }
      giveUp();
    })();
  }
</script>
<link rel="stylesheet" href="style.css" onerror="reloadPage()">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="safe"></div>

  <div id="hud" hidden>
    <div id="frames"></div>
    <!-- the game's own HUD pieces: player badges (image bank 434), a label such as
         "EGGS" and digits (bank 404); each game adds its own HUD (src/<game>/index.js) -->
    <div class="card"><span class="who"></span><img class="badge" alt=""><span class="count"><img class="label" alt="" hidden><span class="num"></span></span></div>
    <div class="card"><span class="who"></span><img class="badge" alt=""><span class="count"><img class="label" alt="" hidden><span class="num"></span></span></div>
    <div class="card"><span class="who"></span><img class="badge" alt=""><span class="count"><img class="label" alt="" hidden><span class="num"></span></span></div>
    <div class="card"><span class="who"></span><img class="badge" alt=""><span class="count"><img class="label" alt="" hidden><span class="num"></span></span></div>
  </div>
  <div id="banner"></div>
  <!-- after a round, who won (module #64's banner: image banks 435 and 442) -->
  <div id="winners" hidden></div>
  <div id="waiting" hidden>Waiting for the others…</div>

  <section id="title" class="screen" hidden>
    <div class="panel">
      <!-- the minigames: their name banners (image banks 403, 396) on their backdrops -->
      <div class="games" role="radiogroup" aria-label="Minigame"></div>
      <h1 class="sr">Egg Emergency</h1>
      <p class="how" id="how"></p>
      <p class="keys" id="keys"></p>
      <div class="levels controls" role="radiogroup" aria-label="Controls" hidden></div>
      <div class="levels" role="radiogroup" aria-label="CPU level">
        <button role="radio" data-level="easy">Easy</button>
        <button role="radio" data-level="normal">Normal</button>
        <button role="radio" data-level="hard">Hard</button>
      </div>
      <button id="play" class="big">Play</button>
      <button id="friends" class="big alt">Play with friends</button>
      <p class="best">Best: <b id="best">–</b> <span class="sep">·</span>
        <button id="sound" class="small">Sound on</button></p>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="panel">
      <img id="champion" src="assets/ui/champion.png" alt="The Champion!" hidden>
      <h2 id="verdict"></h2>
      <ol id="ranking"></ol>
      <p id="newbest" hidden>New best!</p>
      <button id="again" class="big">Play again</button>
      <button id="menu" class="small">Menu</button>
    </div>
  </section>

  <section id="lobby" class="screen" hidden>
    <div class="panel">
      <div class="art short"><img class="logo" alt=""></div>
      <h2>Room <span id="code">····</span></h2>
      <p class="hint" id="note">Up to 4 players. Empty spots are CPUs.</p>
      <p id="status" class="hint"></p>
      <button id="invite" class="big alt">Invite friends</button>
      <div id="link">
        <input id="linkText" readonly aria-label="Invite link" spellcheck="false">
        <button id="copy" class="small" type="button">Copy</button>
      </div>
      <ol id="seats"></ol>
      <div class="games" role="radiogroup" aria-label="Minigame"></div>
      <div class="levels controls" role="radiogroup" aria-label="Controls" hidden></div>
      <div class="levels" role="radiogroup" aria-label="CPU level">
        <button role="radio" data-level="easy">Easy</button>
        <button role="radio" data-level="normal">Normal</button>
        <button role="radio" data-level="hard">Hard</button>
      </div>
      <button id="start" class="big">Start</button>
      <form id="join" autocomplete="off">
        <input id="joinCode" maxlength="6" placeholder="Room code" aria-label="Room code" spellcheck="false" autocapitalize="characters">
        <button class="small" type="submit">Join</button>
      </form>
      <button id="leave" class="small">Leave</button>
    </div>
  </section>

  <div id="loading"><div class="bar"><i></i></div><p>Loading…</p></div>
</div>
<script type="module" src="src/main.js" onerror="reloadPage()"></script>
</body>
</html>
