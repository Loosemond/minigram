<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clips</title>
<style>
  body { margin: 0; background: #4a5566; color: #fff; font: 12px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  #grid div { position: relative; aspect-ratio: 1; }
  #grid span { position: absolute; left: 4px; top: 2px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  #grid span { z-index: 1; text-shadow: 0 1px 2px #000; }
</style>
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
// Dev page: every clip of a model side by side, to name them.
// ?model=assets/clearcut/scyther.glb (default: Chansey), ?t=seconds freezes at that time.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { clone } from "three/addons/utils/SkeletonUtils.js";

THREE.ColorManagement.enabled = false;
const q = new URLSearchParams(location.search);
const url = q.get("model") || "assets/egg/chansey.glb";
const gltf = await new GLTFLoader().loadAsync(url);
const box = new THREE.Box3().setFromObject(gltf.scene);
const size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x4a5566);
const grid = document.getElementById("grid");
const freeze = q.get("t");
const clips = gltf.animations.slice().sort((a, b) => a.name.localeCompare(b.name));
const views = clips.map((clip, i) => {
  const cell = grid.appendChild(document.createElement("div"));
  cell.innerHTML = `<span>${i} ${clip.name} ${clip.duration.toFixed(2)}s</span>`;
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6 * Math.PI));
  const sun = new THREE.DirectionalLight(0xffffff, 0.5 * Math.PI);
  sun.position.set(0.4, 1, 0.8);
  scene.add(sun);
  const model = clone(gltf.scene);
  scene.add(model);
  const mixer = new THREE.AnimationMixer(model);
  mixer.clipAction(clip).play();
  const d = Math.max(size.x, size.y) * 1.6;
  const cam = new THREE.PerspectiveCamera(30, 1, d / 100, d * 10);
  cam.position.set(mid.x, mid.y + size.y * 0.1, mid.z + d * 1.4);
  cam.lookAt(mid.x, mid.y, mid.z);
  return { cell, scene, cam, mixer, clip };
});
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  renderer.setScissorTest(true);
  renderer.clear();
  for (const v of views) {
    if (freeze !== null) v.mixer.setTime(Math.min(+freeze, v.clip.duration)); else v.mixer.update(dt);
    const r = v.cell.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H) continue;
    renderer.setViewport(r.left, H - r.bottom, r.width, r.height);
    renderer.setScissor(r.left, H - r.bottom, r.width, r.height);
    renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
frame();
window.clips = { views, render: frame };
</script>
