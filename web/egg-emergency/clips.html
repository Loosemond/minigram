<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chansey clips</title>
<style>
  body { margin: 0; background: #4a5566; color: #fff; font: 12px system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  #grid div { position: relative; aspect-ratio: 1; }
  #grid span { position: absolute; left: 4px; top: 2px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
  #grid span { z-index: 1; text-shadow: 0 1px 2px #000; }
</style>
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
// Dev page: every Chansey clip side by side, to name them. ?t=seconds freezes at that time.
import * as THREE from "three";
import { loadAssets, makeChansey } from "./src/assets.js";

const assets = await loadAssets("assets/");
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setClearColor(0x4a5566);
const grid = document.getElementById("grid");
const freeze = new URLSearchParams(location.search).get("t");
const views = assets.chansey.clips.map((clip, i) => {
  const cell = grid.appendChild(document.createElement("div"));
  cell.innerHTML = `<span>${i} ${clip.name} ${clip.duration.toFixed(2)}s</span>`;
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.5 * Math.PI));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55 * Math.PI);
  sun.position.set(0.4, 1, 0.8);
  scene.add(sun);
  const ch = makeChansey(assets);
  scene.add(ch.root);
  ch.play(i, { loop: true });
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  cam.position.set(0, 1.2, 4.2);
  cam.lookAt(0, 0.6, 0);
  return { cell, scene, cam, ch };
});
const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H, false);
  renderer.setScissorTest(true);
  renderer.clear();
  for (const v of views) {
    if (freeze !== null) v.ch.seek(+freeze); else v.ch.update(dt);
    const r = v.cell.getBoundingClientRect();
    if (r.bottom < 0 || r.top > H) continue;
    renderer.setViewport(r.left, H - r.bottom, r.width, r.height);
    renderer.setScissor(r.left, H - r.bottom, r.width, r.height);
    renderer.render(v.scene, v.cam);
  }
  requestAnimationFrame(frame);
}
frame();
</script>
