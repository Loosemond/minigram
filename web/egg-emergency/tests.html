<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Egg Emergency: tests</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; }
  #report { flex: 0 0 26rem; padding: 12px 16px; overflow: auto; }
  #report h1 { font-size: 16px; margin: 0 0 8px; }
  #report li { margin: 4px 0; }
  #report li.pass::marker { content: "✓  "; color: #5c5; }
  #report li.fail::marker { content: "✗  "; color: #e55; }
  #report li.run::marker { content: "…  "; color: #999; }
  #report li.skip::marker { content: "?  "; color: #db3; }
  #wait { color: #db3; }
  #report .detail { color: #999; font-size: 12px; white-space: pre-wrap; }
  #report li.fail .detail { color: #e99; }
  #frames { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; overflow: auto; }
  iframe { border: 0; width: 360px; height: 640px; background: #000; }
</style>
</head>
<body>
<!-- Regression tests for the game and online play, in the browser, against the
     rooms server: run tools/serve_web.py and open this page, and keep it
     showing (browsers pause hidden pages' games; the tests that play in real
     time wait for it). They play real games in the frames and take about two
     minutes. The results go in the title (PASS, FAIL or INCONCLUSIVE), the
     list, the console, and window.results (ok: true, false, or null for
     inconclusive). -->
<div id="report"><h1>Egg Emergency tests</h1>
  <p id="wait" hidden>Waiting for this page to show: hidden pages pause the games.</p>
  <ol id="list"></ol></div>
<div id="frames"></div>
<script type="module" src="tests.js"></script>
</body>
</html>
